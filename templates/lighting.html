<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ペンライト演出プレビュー | HEW 2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='lighting.css') }}">
    <script src="{{ url_for('static', filename='lighting.js') }}" defer></script>
</head>
<body>
    <main class="console">
        <header class="page-header">
            <div>
                <p class="eyebrow">HEW 2026 / IA42A</p>
                <h1>ペンライト演出プレビュー</h1>
                <p class="intro">仮想ステージで、ペンライトの光り方を確認できます。</p>
            </div>
            <span class="badge"><span aria-hidden="true"></span>手動テスト</span>
        </header>

        <div class="layout">
            <section class="panel stage-panel" aria-labelledby="stage-title">
                <div class="panel-header">
                    <div>
                        <p class="eyebrow">01 / STAGE</p>
                        <h2 id="stage-title">仮想ステージ</h2>
                    </div>
                    <span class="stage-legend"><span aria-hidden="true"></span>演者</span>
                </div>
                <svg id="stage" class="stage" viewBox="0 0 720 410"
                     role="img" aria-labelledby="stage-image-title stage-image-description">
                    <title id="stage-image-title">ステージと客席の見取り図</title>
                    <desc id="stage-image-description">青いひし形は演者です。客席の点はペンライトです。</desc>
                    <defs>
                        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                            <path d="M30 0H0V30" fill="none" stroke="#1b2940" stroke-width="1"/>
                        </pattern>
                    </defs>
                    <rect width="720" height="410" fill="url(#grid)"/>
                    <rect x="163" y="28" width="394" height="88" rx="13" class="stage-area"/>
                    <text x="183" y="56" class="stage-label">ステージ</text>
                    <path d="M52 141H668" class="stage-divider"/>
                    <text x="52" y="169" class="stage-label">客席</text>
                    <circle id="wave-ring" r="0" visibility="hidden" fill="none" stroke-width="2"/>
                    <g id="penlights"></g>
                    <g id="performer" class="performer">
                        <circle r="14"/>
                        <path d="M0 -8 8 0 0 8 -8 0Z"/>
                    </g>
                </svg>
                <div class="position">
                    <p>ステージ図をクリックするか、下のスライダーで演者の位置を変えられます。</p>
                    <div class="sliders">
                        <label for="position-x">横 <input id="position-x" type="range" min="0" max="720" value="360"></label>
                        <label for="position-y">縦 <input id="position-y" type="range" min="0" max="410" value="77"></label>
                    </div>
                </div>
            </section>

            <section class="panel control-panel" aria-labelledby="control-title">
                <div class="panel-header">
                    <div>
                        <p class="eyebrow">02 / CONTROL</p>
                        <h2 id="control-title">演出の操作</h2>
                    </div>
                </div>
                <fieldset class="effects">
                    <legend>演出を選ぶ</legend>
                    <label class="effect">
                        <input type="radio" name="effect" value="1" checked>
                        <span><strong>全体の色を変える</strong><small>すべてのペンライトが同時に光ります。</small></span>
                    </label>
                    <label class="effect">
                        <input type="radio" name="effect" value="2">
                        <span><strong>波紋を広げる</strong><small>演者の近くから順に光ります。</small></span>
                    </label>
                </fieldset>
                <div class="color-settings">
                    <label for="effect-color">演出色</label>
                    <div class="color-line">
                        <input id="effect-color" type="color" value="#63d5ff">
                        <output id="color-value" for="effect-color">#63D5FF</output>
                        <div class="swatches" aria-label="色の候補">
                            <button type="button" class="swatch" value="#63d5ff" style="--swatch:#63d5ff" aria-label="水色" aria-pressed="true"></button>
                            <button type="button" class="swatch" value="#ab96ff" style="--swatch:#ab96ff" aria-label="紫" aria-pressed="false"></button>
                            <button type="button" class="swatch" value="#ff78a6" style="--swatch:#ff78a6" aria-label="ピンク" aria-pressed="false"></button>
                            <button type="button" class="swatch" value="#ffcf72" style="--swatch:#ffcf72" aria-label="黄色" aria-pressed="false"></button>
                            <button type="button" class="swatch" value="#78e3b5" style="--swatch:#78e3b5" aria-label="緑" aria-pressed="false"></button>
                        </div>
                    </div>
                </div>
                <div class="actions">
                    <button type="button" class="play" id="play">プレビュー再生</button>
                    <button type="button" class="clear" id="clear">消灯</button>
                </div>
                <p id="status" class="status" role="status">再生待ち</p>
            </section>
        </div>
    </main>
</body>
</html>
